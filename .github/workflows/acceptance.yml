name: acceptance

# Runs a PR's `acceptance/<issue>/` specs against THAT PR's OWN BUILD, and, when the PR adds or changes
# a spec, proves it was red on the base branch's build and is green on the PR's.
#
# The logic lives in spiculedata/acceptance-spec (extracted from this repository), called as reusable
# workflows pinned to a FULL COMMIT SHA. What stays here is only what is Saiku specific: how the launcher
# fat JAR is built (Maven, GitHub Packages token), how it is started (loopback, bundled FoodMart demo,
# login admin/admin) and the REST paths. To bump the pin, see "Bumping acceptance-spec" in
# docs/acceptance-specs.md. Do not point `uses:` at a branch or tag.
#
# The GATE is `ci / acceptance convention` inside ci.yml: a PR that closes issue N must ship
# acceptance/N/spec.json. It still runs from this repository's own .github/scripts/acceptance-check.mjs
# (see docs/acceptance-specs.md, "What is still local": moving it waits for acceptance-spec#5).
#
# CHECK NAMES. A reusable workflow's checks are named `<caller job name> / <called job name>`. Every caller
# job below has `name: acceptance`, so the called jobs read `acceptance / detect changed specs`,
# `acceptance / specs on base` and `acceptance / spec fails on base`, exactly as before. The called
# run-specs job is called `acceptance specs` upstream, so it reads `acceptance / acceptance specs`; the
# `specs` job at the bottom republishes its result under the old name `acceptance / specs`, which
# the hive label watcher (EXTRA_CHECKS in quality-queue/label-watch.sh) and the docs key on.
#
# SECURITY. `pull_request` (never `pull_request_target`), read-only token. The runner executes the PR's own
# spec files, which is the point. The launcher listens on loopback only and its login is the public demo
# pair admin/admin, so there is nothing to keep secret (it is passed as the acceptance-spec ACCEPTANCE_USER /
# ACCEPTANCE_PASSWORD secrets only because that is how a reusable workflow takes them; GitHub then masks
# the word "admin" in these logs). The one real secret is GH_PACKAGES_TOKEN, handed over as BUILD_TOKEN to
# resolve the Maven dependencies hosted on GitHub Packages, exactly as ci.yml does; it is withheld from fork
# PRs, which then run only the specs that need no server (api specs are recorded `not-run`, never `pass`).
# The spec commands run with an allow-listed environment and api specs may only talk to the base URL's origin.
#
# The former manual `workflow_dispatch` run against the deployed demo (`target: deployed`) is gone: the
# shared workflows refuse every event but `pull_request`. The ACCEPTANCE_BASE_URL variable is unused now.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: acceptance-specs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Builds the launcher fat JAR from the PR head, starts it on loopback with the FoodMart demo and runs
  # every spec against it. Check name: `acceptance / acceptance specs`.
  run-specs:
    name: acceptance
    uses: spiculedata/acceptance-spec/.github/workflows/run-specs.yml@380780e255019826deb3901987f4004a454a7659
    with:
      mode: enforce
      node-version: "24"
      java-version: "22"
      java-cache: maven
      # Maven cold build ~5 min + boot ~1 min + specs (seconds).
      timeout-minutes: 25
      skip-without-build-token: true
      base-url: http://127.0.0.1:18080
      # Anonymous endpoint, answers 200 once the launcher is up. Bounded wait of 5 minutes.
      ready-url: http://127.0.0.1:18080/rest/saiku/info
      ready-timeout: 300
      base-path: /rest/saiku/api
      session-path: /rest/saiku/session
      # BUILD_TOKEN (= GH_PACKAGES_TOKEN) and GITHUB_ACTOR reach this command; same settings.xml as ci.yml's
      # `build` and `dist` jobs. The fat JAR is copied to a fixed name so that starting, caching and
      # (if ever turned on) sharing it need no glob.
      build-command: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml <<EOF
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
          <servers>
            <server><id>github-mondrian-saiku</id><username>${GITHUB_ACTOR}</username><password>${BUILD_TOKEN}</password></server>
            <server><id>github-olap4j</id><username>${GITHUB_ACTOR}</username><password>${BUILD_TOKEN}</password></server>
            <server><id>github-olap4j-xmlaserver</id><username>${GITHUB_ACTOR}</username><password>${BUILD_TOKEN}</password></server>
            <server><id>github-saiku-query</id><username>${GITHUB_ACTOR}</username><password>${BUILD_TOKEN}</password></server>
            <server><id>github-ossie</id><username>${GITHUB_ACTOR}</username><password>${BUILD_TOKEN}</password></server>
          </servers>
        </settings>
        EOF
        mvn -B -ntp -pl saiku-launcher -am -Dmaven.test.skip=true package
        JAR=$(ls saiku-launcher/target/saiku-*.jar | grep -E '/saiku-[0-9][^/]*\.jar$' | grep -Ev -- '-(sources|test-sources|tests)\.jar$' | head -n1)
        echo "Launcher: $JAR"
        cp "$JAR" acceptance-launcher.jar
      # SAIKU_DEMO=true seeds FoodMart, the admin/admin login and the relaxed AI policy, exactly like
      # demo.saiku.bi. The shared start script detaches it (setsid) so it outlives the step, not the job.
      start-command: |
        mkdir -p "$RUNNER_TEMP/saiku-home"
        SAIKU_DEMO=true SAIKU_TELEMETRY=off exec java -XX:+ExitOnOutOfMemoryError -jar acceptance-launcher.jar serve \
          --host 127.0.0.1 --port 18080 --home "$RUNNER_TEMP/saiku-home"
    secrets:
      BUILD_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      ACCEPTANCE_USER: admin
      ACCEPTANCE_PASSWORD: admin

  # Runs ONLY when the PR adds or changes an acceptance/<issue>/spec.json: that spec must FAIL on the base
  # branch's launcher and PASS on the PR's. Self-contained (builds and runs both sides), so it does not wait
  # for `run-specs`. The base launcher jar is meant to be cached on the base SHA (see base-cache-paths below).
  # Check names: `acceptance / detect changed specs`, `acceptance / specs on head`,
  # `acceptance / specs on base`, `acceptance / spec fails on base`. A human-applied `spec-already-green`
  # label excuses a spec that legitimately passes on base.
  spec-first:
    name: acceptance
    uses: spiculedata/acceptance-spec/.github/workflows/base-check.yml@380780e255019826deb3901987f4004a454a7659
    with:
      mode: enforce
      node-version: "24"
      java-version: "22"
      java-cache: maven
      timeout-minutes: 25
      skip-without-build-token: true
      base-url: http://127.0.0.1:18080
      ready-url: http://127.0.0.1:18080/rest/saiku/info
      ready-timeout: 300
      base-path: /rest/saiku/api
      session-path: /rest/saiku/session
      # Cache the base launcher jar on the base SHA. Works since acceptance-spec#4 (380780e): before that the
      # cache path built for working-directory "." was rejected by actions/cache and nothing was saved.
      base-cache-paths: |
        acceptance-launcher.jar
      # Keep identical to run-specs above (guarded by .github/scripts/acceptance-caller.test.mjs).
      build-command: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml <<EOF
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
          <servers>
            <server><id>github-mondrian-saiku</id><username>${GITHUB_ACTOR}</username><password>${BUILD_TOKEN}</password></server>
            <server><id>github-olap4j</id><username>${GITHUB_ACTOR}</username><password>${BUILD_TOKEN}</password></server>
            <server><id>github-olap4j-xmlaserver</id><username>${GITHUB_ACTOR}</username><password>${BUILD_TOKEN}</password></server>
            <server><id>github-saiku-query</id><username>${GITHUB_ACTOR}</username><password>${BUILD_TOKEN}</password></server>
            <server><id>github-ossie</id><username>${GITHUB_ACTOR}</username><password>${BUILD_TOKEN}</password></server>
          </servers>
        </settings>
        EOF
        mvn -B -ntp -pl saiku-launcher -am -Dmaven.test.skip=true package
        JAR=$(ls saiku-launcher/target/saiku-*.jar | grep -E '/saiku-[0-9][^/]*\.jar$' | grep -Ev -- '-(sources|test-sources|tests)\.jar$' | head -n1)
        echo "Launcher: $JAR"
        cp "$JAR" acceptance-launcher.jar
      start-command: |
        mkdir -p "$RUNNER_TEMP/saiku-home"
        SAIKU_DEMO=true SAIKU_TELEMETRY=off exec java -XX:+ExitOnOutOfMemoryError -jar acceptance-launcher.jar serve \
          --host 127.0.0.1 --port 18080 --home "$RUNNER_TEMP/saiku-home"
    secrets:
      BUILD_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      ACCEPTANCE_USER: admin
      ACCEPTANCE_PASSWORD: admin

  # Keeps the check name `acceptance / specs` alive. It is red exactly when `run-specs` is not green.
  specs:
    name: acceptance / specs
    needs: [run-specs]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Same result as the called run-specs workflow
        env:
          RUN_SPECS_RESULT: ${{ needs.run-specs.result }}
        run: |
          echo "acceptance specs concluded: $RUN_SPECS_RESULT"
          if [ "$RUN_SPECS_RESULT" != "success" ]; then
            echo "::error::acceptance specs concluded $RUN_SPECS_RESULT (see the 'acceptance / acceptance specs' check)"
            exit 1
          fi
